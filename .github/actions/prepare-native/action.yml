name: Prepare pinned native dependencies
description: Prepare the current host's pinned TDLib bundle and media tools.
inputs:
  runner-image:
    description: Runner image label, included in the native cache key.
    default: default
runs:
  using: composite
  steps:
    - name: Install JDK for TDLib and Gradle
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: zulu
        java-version: '21'
    - name: Install macOS build and media tools
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: brew install cmake ninja gperf openssl ffmpeg
    - name: Install Linux build, media and display tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++ gperf libssl-dev zlib1g-dev ffmpeg xvfb xauth libasound2t64 libgl1 libfontconfig1 fonts-noto-cjk fonts-noto-color-emoji
    - name: Set macOS compatibility baseline
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
        echo "NNGGRAM_MACOS_MAX_VERSION=15.0" >> "$GITHUB_ENV"
    - name: Restore host-specific TDLib and media bundle
      if: runner.os != 'Windows'
      id: native-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          native/macos-x64
          native/macos-arm64
          native/linux-x64
          native/linux-arm64
        key: desktop-native-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner-image }}-${{ hashFiles('.github/actions/prepare-native/action.yml', 'native/tdlib-source.properties', 'scripts/build-tdlib.*', 'scripts/GenerateTdlibNativeMetadata.java', 'scripts/bundle-macos-libraries.py', 'scripts/prepare-media*', '.github/scripts/prepare-media-ci.ps1') }}
    - name: Prepare exact Windows TDLib cache and retained archive
      if: runner.os == 'Windows'
      uses: ./.github/actions/prepare-windows-native
    - name: Build macOS or Linux TDLib bundle
      if: runner.os != 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: JOBS=2 sh scripts/build-tdlib.sh
    - name: Prepare verified Windows media tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/prepare-media-ci.ps1
    - name: Prepare relocatable macOS media tools
      if: runner.os == 'macOS' && steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: sh scripts/prepare-media-macos.sh
    - name: Cache host bundle
      if: runner.os != 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          native/macos-x64
          native/macos-arm64
          native/linux-x64
          native/linux-arm64
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
    - name: Retain standalone macOS and Linux TDLib dependencies
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: tdlib-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          native/macos-x64/
          native/macos-arm64/
          native/linux-x64/
          native/linux-arm64/
          !native/**/media/**
        if-no-files-found: error
        compression-level: 0
        retention-days: 90
