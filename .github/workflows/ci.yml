name: Desktop CI
on:
  push:
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: ${{ matrix.profile }} business/UI tests and preview package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, profile: windows-x64 }
          - { runner: macos-15, profile: macos-arm64 }
          - { runner: macos-15-intel, profile: macos-x64 }
          - { runner: ubuntu-24.04, profile: linux-x64 }
          - { runner: ubuntu-24.04-arm, profile: linux-arm64 }
    timeout-minutes: 150
    env:
      # The arm64 Mac has less RAM; other check runners can use four test JVMs.
      ORG_GRADLE_PROJECT_testForks: ${{ matrix.runner == 'macos-15' && '2' || '4' }}
      NNGGRAM_GRADLE_WORKERS: ${{ matrix.runner == 'macos-15' && '2' || '4' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Isolate Gradle user home
        shell: bash
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-checks" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline CI regression tests
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Offline installer and ZIP contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Install and preflight Linux graphics runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri fakeroot
          python -c 'import ctypes; ctypes.CDLL("libEGL.so.1")'
      - uses: ./.github/actions/prepare-native
        with:
          runner-image: ${{ matrix.runner }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/prepare-wix-ci.ps1
          "$env:RUNNER_TEMP/wix311" >> $env:GITHUB_PATH
      - name: Build and smoke-test preview package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/desktop.py build --installer --skip-tests
          else
            python scripts/desktop.py build --installer --skip-tests
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-${{ matrix.profile }}-${{ github.run_id }}
          path: build/distributions/${{ matrix.profile }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Run portable business and UI regressions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/desktop.py check
          else
            python scripts/desktop.py check
          fi
      - name: Upload test evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
            desktopApp/build/test-results/
            shared/build/test-results/
          if-no-files-found: warn
          retention-days: 14
  native:
    name: Trusted Windows native distribution
    needs: checks
    if: >-
      vars.ENABLE_WINDOWS_NATIVE == 'true' &&
      vars.DISTRIBUTION_REPOSITORY != '' && github.repository == vars.DISTRIBUTION_REPOSITORY &&
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch || github.ref == 'refs/heads/dev')
    runs-on: windows-2022
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate distribution identity and isolate Gradle user home
        shell: pwsh
        env:
          NNGGRAM_API_ID: ${{ secrets.NNGGRAM_API_ID }}
          NNGGRAM_API_HASH: ${{ secrets.NNGGRAM_API_HASH }}
        run: |
          $id = 0
          if (-not [int]::TryParse($env:NNGGRAM_API_ID, [ref]$id) -or $id -le 0 -or $env:NNGGRAM_API_HASH -notmatch '^[a-fA-F0-9]{32}$') { throw 'Configure valid NNGGRAM_API_ID and NNGGRAM_API_HASH repository Secrets.' }
          "GRADLE_USER_HOME=$env:RUNNER_TEMP/gradle-native" >> $env:GITHUB_ENV
      - uses: ./.github/actions/prepare-native
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ github.token }}
          set-java-home: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Prepare verified FFmpeg
        shell: pwsh
        run: ./.github/scripts/prepare-media-ci.ps1
      - name: Build native application with builder-owned Telegram identity
        shell: pwsh
        env:
          NNGGRAM_API_ID: ${{ secrets.NNGGRAM_API_ID }}
          NNGGRAM_API_HASH: ${{ secrets.NNGGRAM_API_HASH }}
        run: ./scripts/build-desktop-native.ps1 -GraalVm $env:GRAALVM_HOME -BuildName ci-native -NativeImageHeap 4g -NativeImageThreads 2 -RequireTelegramApi -RunTests
      - name: Verify built EXE using offline native diagnostics
        shell: pwsh
        run: |
          $nativeExe = (Resolve-Path 'desktopApp/build/ci-native/compose/binaries/main/graalvm-app/nngGram/nngGram.exe').Path
          foreach ($mode in @('tdlib', 'platform', 'media')) {
            $report = Join-Path $env:RUNNER_TEMP "ci-$mode-native-result.txt"
            & $nativeExe "--$mode-native-smoke" $report
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw "Offline $mode EXE smoke failed." }
          }
      - name: Package complete native application and installer
        id: package
        shell: pwsh
        run: |
          ./.github/scripts/prepare-wix-ci.ps1
          ./scripts/package-desktop.ps1 -AppDirectory desktopApp/build/ci-native/compose/binaries/main/graalvm-app/nngGram -Version 0.1.0 -BuildName ci-package -WixDirectory "$env:RUNNER_TEMP/wix311"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          python -B .github/scripts/package_metadata.py build/ci-package
          "artifact_name=nngGram-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            build/ci-package/*.zip
            build/ci-package/*.msi
            build/ci-package/SHA256SUMS.txt
            build/ci-package/build-info.json
            build/ci-package/payload-sha256.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  distributions:
    name: Trusted ${{ matrix.profile }} distribution
    needs: checks
    if: >-
      vars.DISTRIBUTION_REPOSITORY != '' && github.repository == vars.DISTRIBUTION_REPOSITORY &&
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch || github.ref == 'refs/heads/dev')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, profile: windows-x64 }
          - { runner: macos-15, profile: macos-arm64 }
          - { runner: macos-15-intel, profile: macos-x64 }
          - { runner: ubuntu-24.04, profile: linux-x64 }
          - { runner: ubuntu-24.04-arm, profile: linux-arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-native
        with:
          runner-image: ${{ matrix.runner }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Prepare Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/prepare-wix-ci.ps1
          "$env:RUNNER_TEMP/wix311" >> $env:GITHUB_PATH
      - name: Build and verify distribution with builder-owned identity
        shell: bash
        env:
          NNGGRAM_API_ID: ${{ secrets.NNGGRAM_API_ID }}
          NNGGRAM_API_HASH: ${{ secrets.NNGGRAM_API_HASH }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/desktop.py build --release --installer --skip-tests
          else
            python scripts/desktop.py build --release --installer --skip-tests
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nngGram-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/distributions/${{ matrix.profile }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  telegram:
    name: Send CI ZIP to Telegram
    needs: native
    # 在仓库 Variables 中显式启用；PR、fork 和其它分支不会向频道发消息。
    if: >-
      vars.TELEGRAM_ENABLED == 'true' &&
      vars.DISTRIBUTION_REPOSITORY != '' && github.repository == vars.DISTRIBUTION_REPOSITORY &&
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # 同一机器人在多个临时服务器之间切换前必须结束上一次发送。
    concurrency:
      group: telegram-ci-channel
      cancel-in-progress: false
      queue: max
    env:
      # 官方 Bot API 10.3 源码；仅缓存编译后的程序，不缓存机器人会话。
      TELEGRAM_BOT_API_COMMIT: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Telegram configuration
        id: telegram-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 -B .github/scripts/telegram_ci.py --check-config

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.native.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-dist

      - name: Restore official Bot API binary
        id: bot-api-cache
        if: steps.telegram-config.outputs.api_mode == 'local'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: telegram-bot-api-ubuntu24.04-${{ runner.arch }}-${{ env.TELEGRAM_BOT_API_COMMIT }}-v1

      - name: Build official Bot API server
        if: steps.telegram-config.outputs.api_mode == 'local' && steps.bot-api-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: bash .github/scripts/build_telegram_bot_api.sh

      - name: Cache official Bot API binary
        if: steps.telegram-config.outputs.api_mode == 'local' && steps.bot-api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: ${{ steps.bot-api-cache.outputs.cache-primary-key }}

      - name: Send ZIP or download link through selected Bot API
        timeout-minutes: 25
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_API_BINARY: ${{ runner.temp }}/telegram-bot-api-bin/telegram-bot-api
          ARTIFACT_URL: ${{ needs.native.outputs.artifact_url }}
        run: python3 -B .github/scripts/telegram_ci.py "$RUNNER_TEMP/ci-dist"
